<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>French Cheat Sheet - A1 & A2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* ── Level Toggle ── */
        .level-toggle {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .level-btn {
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #667eea;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .level-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        /* ── Class Selector ── */
        .class-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .class-btn {
            padding: 8px 16px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .class-btn:hover {
            background: white;
            color: #667eea;
        }

        .class-btn.active {
            background: white;
            color: #667eea;
        }

        /* ── Category Grid ── */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .category-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 6px solid;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .category-card.vocab {
            border-left-color: #FF6B6B;
            background: linear-gradient(135deg, rgba(255,107,107,0.05) 0%, transparent 100%);
        }

        .category-card.grammar {
            border-left-color: #4ECDC4;
            background: linear-gradient(135deg, rgba(78,205,196,0.05) 0%, transparent 100%);
        }

        .category-card.verbs {
            border-left-color: #FFD93D;
            background: linear-gradient(135deg, rgba(255,217,61,0.05) 0%, transparent 100%);
        }

        .category-card.phrases {
            border-left-color: #95E1D3;
            background: linear-gradient(135deg, rgba(149,225,211,0.05) 0%, transparent 100%);
        }

        .category-card.pronunciation {
            border-left-color: #C7CEEA;
            background: linear-gradient(135deg, rgba(199,206,234,0.05) 0%, transparent 100%);
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #333;
        }

        .category-title i {
            font-size: 1.6rem;
        }

        .category-card.vocab .category-title { color: #FF6B6B; }
        .category-card.grammar .category-title { color: #4ECDC4; }
        .category-card.verbs .category-title { color: #FFD93D; }
        .category-card.phrases .category-title { color: #95E1D3; }
        .category-card.pronunciation .category-title { color: #C7CEEA; }

        /* ── Content Items ── */
        .content-items {
            display: none;
        }

        .content-items.active {
            display: block;
        }

        .item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 3px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .category-card.vocab .item { border-left-color: #FF6B6B; }
        .category-card.grammar .item { border-left-color: #4ECDC4; }
        .category-card.verbs .item { border-left-color: #FFD93D; }
        .category-card.phrases .item { border-left-color: #95E1D3; }
        .category-card.pronunciation .item { border-left-color: #C7CEEA; }

        .item-content {
            flex: 1;
        }

        .french {
            font-weight: 700;
            color: #333;
            font-size: 1.1rem;
        }

        .english {
            font-size: 0.9rem;
            color: #666;
            margin-top: 4px;
        }

        .speak-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .speak-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* ── Toggle Arrow ── */
        .toggle-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
            font-size: 1.2rem;
            color: #667eea;
            margin-left: auto;
        }

        .category-card.vocab .toggle-arrow { color: #FF6B6B; }
        .category-card.grammar .toggle-arrow { color: #4ECDC4; }
        .category-card.verbs .toggle-arrow { color: #FFD93D; }
        .category-card.phrases .toggle-arrow { color: #95E1D3; }
        .category-card.pronunciation .toggle-arrow { color: #C7CEEA; }

        .category-card.active .toggle-arrow {
            transform: rotate(180deg);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        /* ── Loading ── */
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2rem;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .category-grid {
                grid-template-columns: 1fr;
            }

            .level-btn {
                padding: 10px 25px;
                font-size: 1rem;
            }

            .class-btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }

        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .scroll-top.show {
            opacity: 1;
        }

        .scroll-top:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🇫🇷 French Cheat Sheet</h1>
            <p>Click on topics to reveal content • Click 🔊 to hear pronunciation</p>
        </div>

        <!-- Level Toggle -->
        <div class="level-toggle">
            <button class="level-btn" data-level="a1" onclick="switchLevel('a1')">A1 Beginner</button>
            <button class="level-btn active" data-level="a2" onclick="switchLevel('a2')">A2 Elementary</button>
        </div>

        <!-- Class Selector -->
        <div class="class-selector" id="class-selector"></div>

        <!-- Content Area -->
        <div id="content-area" class="category-grid">
            <div class="loading">Loading classes...</div>
        </div>
    </div>

    <button class="scroll-top" onclick="scrollToTop()">↑</button>

    <script>
        let manifest = {};
        let currentLevel = 'a2';
        let currentClass = 1;

        const categoryConfig = {
            'vocab': { name: 'Vocabulary', icon: 'fas fa-book', color: 'vocab' },
            'grammar': { name: 'Grammar', icon: 'fas fa-rules', color: 'grammar' },
            'verbs': { name: 'Verbs', icon: 'fas fa-bolt', color: 'verbs' },
            'phrases': { name: 'Expressions', icon: 'fas fa-comments', color: 'phrases' },
            'pronunciation': { name: 'Pronunciation', icon: 'fas fa-microphone', color: 'pronunciation' }
        };

        // Initialize
        async function init() {
            try {
                const response = await fetch('classes-manifest.json');
                manifest = await response.json();
                updateClassSelector();
                loadContent();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('content-area').innerHTML = '<p style="color:white">Error loading content</p>';
            }
        }

        function switchLevel(level) {
            currentLevel = level;
            currentClass = manifest[level]?.[0]?.num || 1;

            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-level="${level}"]`).classList.add('active');

            updateClassSelector();
            loadContent();
        }

        function updateClassSelector() {
            const selector = document.getElementById('class-selector');
            selector.innerHTML = '';

            const classes = manifest[currentLevel] || [];
            classes.forEach(cls => {
                const btn = document.createElement('button');
                btn.className = `class-btn ${cls.num === currentClass ? 'active' : ''}`;
                btn.textContent = `Class ${cls.num}`;
                btn.onclick = () => selectClass(cls.num);
                selector.appendChild(btn);
            });
        }

        function selectClass(classNum) {
            currentClass = classNum;
            updateClassSelector();
            loadContent();
            scrollToTop();
        }

        async function loadContent() {
            const contentArea = document.getElementById('content-area');
            const classes = manifest[currentLevel] || [];
            const classData = classes.find(c => c.num === currentClass);

            if (!classData) {
                contentArea.innerHTML = '<p style="color:white">Class not found</p>';
                return;
            }

            try {
                const response = await fetch(classData.file);
                const text = await response.text();
                renderCheatSheet(text, contentArea);
            } catch (error) {
                contentArea.innerHTML = `<p style="color:white">Error: ${error.message}</p>`;
            }
        }

        function renderCheatSheet(text, container) {
            const categories = {
                vocab: [],
                grammar: [],
                verbs: [],
                phrases: [],
                pronunciation: []
            };

            // Parse content
            const lines = text.split('\n');
            let currentCategory = 'vocab';

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                if (line.toLowerCase().includes('vocabulary')) currentCategory = 'vocab';
                else if (line.toLowerCase().includes('grammar')) currentCategory = 'grammar';
                else if (line.toLowerCase().includes('verb')) currentCategory = 'verbs';
                else if (line.toLowerCase().includes('expres') || line.toLowerCase().includes('phrase')) currentCategory = 'phrases';
                else if (line.toLowerCase().includes('pronunciation')) currentCategory = 'pronunciation';
                else if (line.includes('—') || line.includes('-')) {
                    const parts = line.split(/[—-]/);
                    if (parts.length >= 2) {
                        const french = parts[0].trim();
                        const english = parts[1].trim();
                        if (french && english && !french.match(/^#{1,3}/)) {
                            categories[currentCategory].push({ french, english });
                        }
                    }
                }
            });

            // Render cards
            let html = '';
            for (const [key, items] of Object.entries(categories)) {
                if (items.length > 0) {
                    const config = categoryConfig[key];
                    html += `
                        <div class="category-card ${config.color}" onclick="toggleCategory(this)">
                            <div class="category-header">
                                <div class="category-title">
                                    <i class="${config.icon}"></i>
                                    ${config.name}
                                    <span class="toggle-arrow">▼</span>
                                </div>
                            </div>
                            <div class="content-items">
                                ${items.map(item => `
                                    <div class="item">
                                        <div class="item-content">
                                            <div class="french">${item.french}</div>
                                            <div class="english">→ ${item.english}</div>
                                        </div>
                                        <button class="speak-btn" onclick="speak('${item.french}')">
                                            <i class="fas fa-volume-up"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            container.innerHTML = html || '<p style="color:white">No content found</p>';
        }

        function toggleCategory(element) {
            element.classList.toggle('active');
            const items = element.querySelector('.content-items');
            items.classList.toggle('active');
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            speechSynthesis.speak(utterance);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('scroll', () => {
            const btn = document.querySelector('.scroll-top');
            btn.classList.toggle('show', window.pageYOffset > 300);
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
