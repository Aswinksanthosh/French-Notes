<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>French Class Notes - A1 & A2 Levels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #222;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .app-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }

        /* ── Level Toggle ── */
        .level-toggle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            gap: 20px;
        }

        .level-toggle {
            display: flex;
            gap: 12px;
            background: white;
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #e0e0e0;
        }

        .level-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .level-btn:hover {
            color: #1a4d8f;
            background: rgba(26, 77, 143, 0.05);
        }

        .level-btn.active {
            background: linear-gradient(135deg, #1a4d8f 0%, #2a5cb8 100%);
            color: white;
            box-shadow: 0 2px 10px rgba(26, 77, 143, 0.3);
        }

        /* ── Topic/Class Buttons ── */
        .topic-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
        }

        .topic-btn {
            padding: 10px 20px;
            border: 2px solid #1a4d8f;
            background: white;
            color: #1a4d8f;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .topic-btn:hover {
            background: rgba(26, 77, 143, 0.1);
        }

        .topic-btn.active {
            background: #1a4d8f;
            color: white;
            box-shadow: 0 2px 8px rgba(26, 77, 143, 0.3);
        }

        /* ── Content Panels ── */
        .level-panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .level-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Header ── */
        .header {
            background: white;
            border-radius: 15px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-left: 6px solid #1a4d8f;
        }

        .header h1 {
            margin: 0 0 8px;
            color: #1a4d8f;
            font-size: 2.2rem;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 1.05rem;
        }

        /* ── Cheat Sheet Section ── */
        .cheat-sheet {
            background: linear-gradient(135deg, #fff9e6 0%, #fff5cc 100%);
            border-left: 5px solid #f0ad4e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(240, 173, 78, 0.15);
        }

        .cheat-sheet h2 {
            color: #d9851f;
            margin: 0 0 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cheat-sheet h2 i {
            font-size: 1.3rem;
        }

        .cheat-sheet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .cheat-sheet-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #f0ad4e;
        }

        .cheat-sheet-item strong {
            color: #1a4d8f;
            display: block;
            margin-bottom: 5px;
            font-size: 1.05rem;
        }

        .cheat-sheet-item em {
            color: #666;
            font-style: normal;
            font-size: 0.95rem;
        }

        /* ── Clickable French Words ── */
        .french-word {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #1a4d8f;
        }

        .french-word:hover {
            background: rgba(26, 77, 143, 0.15);
            text-decoration: underline;
        }

        /* ── Full Content ── */
        .content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            line-height: 1.8;
        }

        .content h2 {
            color: #1a4d8f;
            font-size: 1.8rem;
            margin-top: 32px;
            margin-bottom: 16px;
            border-bottom: 3px solid #eef2fa;
            padding-bottom: 12px;
        }

        .content h2:first-child {
            margin-top: 0;
        }

        .content h3 {
            color: #2a5cb8;
            font-size: 1.3rem;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .content p {
            margin: 12px 0;
            color: #333;
        }

        .content ul, .content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .content li {
            margin: 8px 0;
            color: #333;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
        }

        .content th {
            background: #eef2fa;
            color: #1a4d8f;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #1a4d8f;
        }

        .content td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .content tr:hover {
            background: #f9fbfd;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .app-wrapper {
                padding: 16px 12px 60px;
            }

            .header {
                padding: 24px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .content {
                padding: 20px;
            }

            .level-btn {
                padding: 10px 24px;
                font-size: 0.95rem;
            }

            .topic-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }

            .cheat-sheet-grid {
                grid-template-columns: 1fr;
            }
        }

        .scroll-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a4d8f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 77, 143, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .scroll-to-top.show {
            opacity: 1;
        }

        .scroll-to-top:hover {
            background: #2a5cb8;
        }
    </style>
</head>

<body>
    <div class="app-wrapper">
        <!-- Level Toggle -->
        <div class="level-toggle-container">
            <div class="level-toggle">
                <button class="level-btn" data-level="a1" onclick="switchLevel('a1')">
                    <i class="fas fa-book"></i> A1 (Beginner)
                </button>
                <button class="level-btn active" data-level="a2" onclick="switchLevel('a2')">
                    <i class="fas fa-book"></i> A2 (Elementary)
                </button>
            </div>
        </div>

        <!-- A1 Panel -->
        <div id="a1-panel" class="level-panel">
            <div class="header">
                <h1>A1 Level - French Foundations</h1>
                <p>Beginner level: Alphabet, greetings, basic verbs, pronouns, and essential vocabulary</p>
            </div>
            <div class="topic-selector" id="a1-topics"></div>
            <div class="content" id="a1-content">
                <p>Loading A1 topics...</p>
            </div>
        </div>

        <!-- A2 Panel -->
        <div id="a2-panel" class="level-panel active">
            <div class="header">
                <h1>A2 Level - Building Fluency</h1>
                <p>Elementary level: Adjectives, advanced grammar, expanded vocabulary, and conversational skills</p>
            </div>
            <div class="topic-selector" id="a2-topics"></div>
            <div class="content" id="a2-content">
                <p>Loading A2 content...</p>
            </div>
        </div>
    </div>

    <button class="scroll-to-top" onclick="scrollToTop()">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
        let manifest = {};
        let currentLevel = 'a2';
        let currentClass = 1;

        async function init() {
            try {
                const response = await fetch('classes-manifest.json');
                manifest = await response.json();
                buildTopicSelectors();
                loadContent();
            } catch (error) {
                console.error('Error loading manifest:', error);
            }
        }

        function switchLevel(level) {
            currentLevel = level;
            currentClass = manifest[level][0].num;

            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-level="${level}"]`).classList.add('active');

            document.querySelectorAll('.level-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById(`${level}-panel`).classList.add('active');

            buildTopicSelectors();
            loadContent();
            scrollToTop();
        }

        function buildTopicSelectors() {
            const classes = manifest[currentLevel] || [];
            const selector = document.getElementById(`${currentLevel}-topics`);
            selector.innerHTML = '';

            classes.forEach(cls => {
                const btn = document.createElement('button');
                btn.className = `topic-btn ${cls.num === currentClass ? 'active' : ''}`;
                btn.textContent = cls.name;
                btn.onclick = () => selectTopic(cls.num);
                selector.appendChild(btn);
            });
        }

        function selectTopic(classNum) {
            currentClass = classNum;
            buildTopicSelectors();
            loadContent();
            scrollToTop();
        }

        async function loadContent() {
            const classes = manifest[currentLevel] || [];
            const classData = classes.find(c => c.num === currentClass);

            if (!classData) {
                document.getElementById(`${currentLevel}-content`).innerHTML = '<p>Content not found</p>';
                return;
            }

            try {
                const response = await fetch(classData.file);
                const text = await response.text();
                const html = renderContentWithCheatSheet(text);
                document.getElementById(`${currentLevel}-content`).innerHTML = html;
            } catch (error) {
                document.getElementById(`${currentLevel}-content`).innerHTML = `<p>Error loading: ${error.message}</p>`;
            }
        }

        function renderContentWithCheatSheet(text) {
            const cheatSheet = extractCheatSheet(text);

            let html = '';

            // Add cheat sheet section if items found
            if (Object.values(cheatSheet).some(arr => arr.length > 0)) {
                html += '<div class="cheat-sheet">';
                html += '<h2><i class="fas fa-star"></i> Quick Reference</h2>';
                html += '<div class="cheat-sheet-grid">';

                for (const [category, items] of Object.entries(cheatSheet)) {
                    if (items.length > 0) {
                        items.slice(0, 8).forEach(item => {
                            html += `
                                <div class="cheat-sheet-item">
                                    <strong class="french-word" onclick="speakFrench('${item.french.replace(/'/g, "\\'")}')">${escapeHtml(item.french)} 🔊</strong>
                                    <em>${escapeHtml(item.english)}</em>
                                </div>
                            `;
                        });
                    }
                }

                html += '</div></div>';
            }

            // Add full content with clickable French words
            const contentWithSpeech = addSpeechToFrench(text);
            html += `<div style="white-space: pre-wrap; word-wrap: break-word; font-size: 0.95rem;">${contentWithSpeech}</div>`;

            return html;
        }

        function addSpeechToFrench(text) {
            const escaped = escapeHtml(text);

            // Find French words with accents and common French words
            const frenchPattern = /\b([a-zàâäéèêëïîôöùûüœæçA-ZÀÂÄÉÈÊËÏÎÔÖÙÛÜŒÆÇ][a-zàâäéèêëïîôöùûüœæç'-]*)\b/g;

            const commonFrench = ['je', 'tu', 'il', 'elle', 'nous', 'vous', 'ils', 'elles', 'le', 'la', 'les',
                                'un', 'une', 'des', 'de', 'du', 'être', 'avoir', 'aller', 'faire', 'venir',
                                'pouvoir', 'vouloir', 'devoir', 'dire', 'voir', 'savoir', 'parler', 'écouter',
                                'bonjour', 'bonsoir', 'merci', 'oui', 'non', 'amour', 'amis'];

            let result = escaped;
            result = result.replace(frenchPattern, (match) => {
                const hasAccent = /[àâäéèêëïîôöùûüœæç]/i.test(match);
                const isCommon = commonFrench.includes(match.toLowerCase());

                if (hasAccent || isCommon) {
                    return `<span class="french-word" onclick="speakFrench('${match.replace(/'/g, "\\'")}')">${match}</span>`;
                }
                return match;
            });

            return result;
        }

        function speakFrench(word) {
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }

        function extractCheatSheet(text) {
            const items = { vocab: [] };
            const lines = text.split('\n');

            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.includes('—') || (trimmed.includes('-') && trimmed.match(/—|-.+—|-\s/))) {
                    const parts = trimmed.split(/[—-]/);
                    if (parts.length >= 2) {
                        const french = parts[0].trim();
                        const english = parts.slice(1).join('-').trim();

                        if (french && english && french.length > 1 && english.length > 1 && !french.match(/^[*#]/)) {
                            items.vocab.push({ french, english });
                        }
                    }
                }
            });

            return items;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('scroll', () => {
            const btn = document.querySelector('.scroll-to-top');
            if (window.pageYOffset > 300) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
