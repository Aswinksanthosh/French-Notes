<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French Class Notes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root {
    --blue: #1a4d8f;
    --lightblue: #eef2fa;
    --notebg: #fff8e1;
    --border: #e0e0e0;
    --cheatbg: #fff9e6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Georgia, serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    line-height: 1.65;
    color: #222;
    background: #fafafa;
  }

  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .header h1 {
    border-bottom: 3px solid var(--blue);
    padding-bottom: 10px;
    color: var(--blue);
    margin-bottom: 5px;
  }

  .header .hint {
    font-size: 14px;
    color: #666;
    margin: 15px 0;
  }

  /* Level & Chapter Selection */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 30px;
  }

  .level-selector {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .level-btn, .chapter-btn {
    padding: 10px 20px;
    border: 2px solid var(--blue);
    background: white;
    color: var(--blue);
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .level-btn:hover, .chapter-btn:hover {
    background: var(--lightblue);
  }

  .level-btn.active, .chapter-btn.active {
    background: var(--blue);
    color: white;
  }

  .chapter-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .chapter-btn {
    padding: 8px 14px;
    font-size: 13px;
  }

  .lesson-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 32px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .lesson-header {
    background: var(--blue);
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    margin: -28px -32px 20px;
  }

  .lesson-header h2 { margin: 0; font-size: 22px; }
  .lesson-header .date { font-weight: normal; font-size: 14px; opacity: 0.85; }
  .topic { font-style: italic; color: #555; margin-bottom: 24px; }

  /* Cheat Sheet */
  .cheat-sheet {
    background: linear-gradient(135deg, #fff9e6 0%, #fff5cc 100%);
    border-left: 5px solid #f0ad4e;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 25px;
  }

  .cheat-sheet h3 {
    color: #d9851f;
    margin: 0 0 15px;
    border: none;
    padding: 0;
    font-size: 16px;
  }

  .cheat-sheet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .cheat-item {
    background: white;
    padding: 12px;
    border-left: 3px solid #f0ad4e;
    border-radius: 4px;
  }

  .cheat-item strong {
    color: var(--blue);
    font-size: 14px;
    display: block;
    margin-bottom: 3px;
    cursor: pointer;
  }

  .cheat-item strong:hover {
    text-decoration: underline;
  }

  .cheat-item em {
    font-style: normal;
    color: #666;
    font-size: 13px;
  }

  h3 {
    color: var(--blue);
    border-bottom: 2px solid var(--lightblue);
    padding-bottom: 5px;
    margin-top: 28px;
    font-size: 17px;
  }

  h3:first-of-type { margin-top: 0; }

  table { border-collapse: collapse; width: 100%; margin: 10px 0 18px; font-size: 15px; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  th { background: var(--lightblue); }

  .fr { font-weight: bold; color: var(--blue); cursor: pointer; }
  .fr:hover { background: var(--lightblue); padding: 0 4px; border-radius: 3px; }

  .note {
    background: var(--notebg);
    border-left: 4px solid #f0ad4e;
    padding: 12px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
  }

  .example { font-style: italic; color: #444; cursor: pointer; }
  .example:hover { background: var(--lightblue); padding: 0 4px; }

  /* Checklist */
  .checklist { list-style: none; padding: 0; margin: 10px 0 18px; }
  .checklist li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 6px;
  }
  .checklist li:hover { background: var(--lightblue); }
  .checklist input[type="checkbox"] {
    margin-top: 3px;
    width: 17px;
    height: 17px;
    accent-color: var(--blue);
    cursor: pointer;
    flex-shrink: 0;
  }
  .checklist label { cursor: pointer; }
  .checklist input:checked + label { text-decoration: line-through; color: #999; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 10px 0 18px; }
  .table-wrap table { margin: 0; }

  @media (max-width: 600px) {
    body { padding: 12px 10px; font-size: 15px; }
    h1 { font-size: 24px; }
    .lesson-card { padding: 18px 14px; border-radius: 8px; }
    .lesson-header { margin: -18px -14px 16px; padding: 10px 14px; }
    .lesson-header h2 { font-size: 18px; }
    h3 { font-size: 15px; margin-top: 24px; }
    table { font-size: 13px; min-width: 420px; }
    th, td { padding: 6px 8px; }
    .chapter-btn { padding: 6px 10px; font-size: 12px; }
    .cheat-sheet-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🇫🇷 French Class Notes</h1>
  <p class="hint">🔊 Tap any French word to hear it spoken aloud</p>
</div>

<!-- Level Selection -->
<div class="controls">
  <div class="level-selector">
    <button class="level-btn active" onclick="switchLevel('a1')">A1 (Beginner)</button>
    <button class="level-btn" onclick="switchLevel('a2')">A2 (Elementary)</button>
  </div>

  <!-- Chapter Selection -->
  <div class="chapter-selector" id="chapter-selector"></div>
</div>

<!-- Content Area -->
<div class="lesson-card" id="content"></div>

<script>
  let manifest = {};
  let currentLevel = 'a1';
  let currentClass = 1;

  const cheatSheetClasses = [1, 2, 3]; // Only add cheat sheets for first 3 classes

  async function init() {
    try {
      const response = await fetch('classes-manifest.json');
      manifest = await response.json();
      buildChapterSelector();
      loadChapter();
    } catch (error) {
      console.error('Error:', error);
      document.getElementById('content').innerHTML = '<p>Error loading content</p>';
    }
  }

  function switchLevel(level) {
    currentLevel = level;
    currentClass = manifest[level][0].num;

    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    buildChapterSelector();
    loadChapter();
  }

  function buildChapterSelector() {
    const classes = manifest[currentLevel] || [];
    const selector = document.getElementById('chapter-selector');
    selector.innerHTML = '';

    classes.forEach(cls => {
      const btn = document.createElement('button');
      btn.className = `chapter-btn ${cls.num === currentClass ? 'active' : ''}`;
      btn.textContent = cls.name;
      btn.onclick = () => selectChapter(cls.num);
      selector.appendChild(btn);
    });
  }

  function selectChapter(classNum) {
    currentClass = classNum;
    buildChapterSelector();
    loadChapter();
    window.scrollTo(0, 0);
  }

  async function loadChapter() {
    const classes = manifest[currentLevel] || [];
    const classData = classes.find(c => c.num === currentClass);

    if (!classData) {
      document.getElementById('content').innerHTML = '<p>Chapter not found</p>';
      return;
    }

    try {
      const response = await fetch(classData.file);
      const text = await response.text();
      const html = renderChapter(text, classData.name, classData.num);
      document.getElementById('content').innerHTML = html;
    } catch (error) {
      document.getElementById('content').innerHTML = `<p>Error: ${error.message}</p>`;
    }
  }

  function renderChapter(text, name, num) {
    let html = `
      <div class="lesson-header">
        <h2>${name}</h2>
      </div>
    `;

    // Add cheat sheet for first 3 classes only
    if (cheatSheetClasses.includes(num)) {
      const cheatSheet = extractCheatSheet(text);
      if (cheatSheet.length > 0) {
        html += '<div class="cheat-sheet">';
        html += '<h3><i class="fas fa-star"></i> Quick Reference</h3>';
        html += '<div class="cheat-sheet-grid">';

        cheatSheet.slice(0, 6).forEach(item => {
          html += `
            <div class="cheat-item">
              <strong onclick="speak('${item.french.replace(/'/g, "\\'")}')">${escapeHtml(item.french)} 🔊</strong>
              <em>${escapeHtml(item.english)}</em>
            </div>
          `;
        });

        html += '</div></div>';
      }
    }

    // Add full content with clickable French text
    html += '<div>' + formatContent(text) + '</div>';

    return html;
  }

  function extractCheatSheet(text) {
    const items = [];
    const lines = text.split('\n');

    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.includes('—') || (trimmed.includes('-') && !trimmed.startsWith('-'))) {
        const parts = trimmed.split(/[—-]/);
        if (parts.length >= 2) {
          const french = parts[0].trim();
          const english = parts.slice(1).join('-').trim();

          if (french && english && french.length > 1 && !french.match(/^[*#]/)) {
            items.push({ french, english });
          }
        }
      }
    });

    return items;
  }

  function formatContent(text) {
    const escaped = escapeHtml(text);

    // Wrap sentences with French content
    let result = '';
    const sentences = escaped.split(/([.!?]+)/);

    for (let i = 0; i < sentences.length; i += 2) {
      const sentence = sentences[i];
      const punct = sentences[i + 1] || '';

      if (!sentence.trim()) continue;

      const hasFrench = /[àâäéèêëïîôöùûüœæç]|bonjour|bonsoir|merci|café|français|classe/i.test(sentence);

      if (hasFrench && sentence.trim().length > 3) {
        const clean = sentence.trim();
        result += `<span class="example" onclick="speak('${clean.replace(/'/g, "\\'")}')">${sentence}</span>${punct}`;
      } else {
        result += sentence + punct;
      }
    }

    return `<p class="topic">${result}</p>`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function speak(word) {
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = 'fr-FR';
    utterance.rate = 0.85;
    speechSynthesis.speak(utterance);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
