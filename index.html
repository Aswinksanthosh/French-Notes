<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>French Class Notes - A1 & A2 Levels</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #222;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .app-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }

        /* ── Level & Class Toggle ── */
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-bottom: 40px;
        }

        .toggle-row {
            display: flex;
            gap: 12px;
            background: white;
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #e0e0e0;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            color: #1a4d8f;
            background: rgba(26, 77, 143, 0.05);
        }

        .btn.active {
            background: linear-gradient(135deg, #1a4d8f 0%, #2a5cb8 100%);
            color: white;
            box-shadow: 0 2px 10px rgba(26, 77, 143, 0.3);
        }

        /* ── Class Selector ── */
        .class-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 900px;
        }

        .class-btn {
            padding: 10px 20px;
            border: 2px solid #1a4d8f;
            background: white;
            color: #1a4d8f;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .class-btn:hover {
            background: rgba(26, 77, 143, 0.1);
        }

        .class-btn.active {
            background: #1a4d8f;
            color: white;
        }

        /* ── Content Panels ── */
        .level-panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .level-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Header ── */
        .header {
            background: white;
            border-radius: 15px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-left: 6px solid #1a4d8f;
        }

        .header h1 {
            margin: 0 0 8px;
            color: #1a4d8f;
            font-size: 2.2rem;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 1.05rem;
        }

        /* ── Content Styles ── */
        .content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            line-height: 1.8;
            max-height: 80vh;
            overflow-y: auto;
        }

        .content h1, .content h2 {
            color: #1a4d8f;
            margin-top: 32px;
            margin-bottom: 16px;
            border-bottom: 3px solid #eef2fa;
            padding-bottom: 12px;
        }

        .content h1:first-child, .content h2:first-child {
            margin-top: 0;
        }

        .content h3 {
            color: #2a5cb8;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .content p {
            margin: 12px 0;
            color: #333;
        }

        .content ul, .content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .content li {
            margin: 8px 0;
            color: #333;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .content th {
            background: #eef2fa;
            color: #1a4d8f;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #1a4d8f;
        }

        .content td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .content tr:hover {
            background: #f9fbfd;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .app-wrapper {
                padding: 16px 12px 60px;
            }

            .header {
                padding: 24px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .toggle-row {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .class-selector {
                gap: 8px;
            }

            .class-btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }

        .scroll-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a4d8f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 77, 143, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .scroll-to-top.show {
            opacity: 1;
        }

        .scroll-to-top:hover {
            background: #2a5cb8;
        }
    </style>
</head>

<body>
    <div class="app-wrapper">
        <!-- Controls -->
        <div class="controls-container">
            <!-- Level Toggle -->
            <div class="toggle-row">
                <button class="btn" data-level="a1" onclick="switchLevel('a1')">
                    📚 A1 (Beginner)
                </button>
                <button class="btn active" data-level="a2" onclick="switchLevel('a2')">
                    📚 A2 (Elementary)
                </button>
            </div>

            <!-- Class Selector -->
            <div class="class-selector" id="class-selector"></div>
        </div>

        <!-- A1 Panel -->
        <div id="a1-panel" class="level-panel">
            <div class="header">
                <h1>A1 Level - French Foundations</h1>
                <p id="a1-header-text">20 Classes | Beginner fundamentals</p>
            </div>
            <div class="content" id="a1-content">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <!-- A2 Panel -->
        <div id="a2-panel" class="level-panel active">
            <div class="header">
                <h1>A2 Level - Building Fluency</h1>
                <p id="a2-header-text">Classes Available | Elementary level</p>
            </div>
            <div class="content" id="a2-content">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <button class="scroll-to-top" onclick="scrollToTop()">↑</button>

    <script>
        let manifest = {};
        let currentLevel = 'a2';
        let currentClass = 1;

        // Load manifest and initialize
        async function init() {
            try {
                const response = await fetch('classes-manifest.json');
                manifest = await response.json();
                updateClassSelector();
                loadContent();
            } catch (error) {
                console.error('Error loading manifest:', error);
                document.getElementById('a1-content').innerHTML = '<p>Error loading classes</p>';
                document.getElementById('a2-content').innerHTML = '<p>Error loading classes</p>';
            }
        }

        // Switch level
        function switchLevel(level) {
            currentLevel = level;
            currentClass = manifest[level]?.[0]?.num || 1;

            document.querySelectorAll('[data-level]').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-level="${level}"]`).classList.add('active');

            document.querySelectorAll('.level-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById(`${level}-panel`).classList.add('active');

            updateClassSelector();
            loadContent();
            scrollToTop();
        }

        // Update class selector
        function updateClassSelector() {
            const selector = document.getElementById('class-selector');
            selector.innerHTML = '';

            const classes = manifest[currentLevel] || [];
            classes.forEach(cls => {
                const btn = document.createElement('button');
                btn.className = `class-btn ${cls.num === currentClass ? 'active' : ''}`;
                btn.textContent = `Class ${cls.num}`;
                btn.onclick = () => selectClass(cls.num);
                selector.appendChild(btn);
            });

            // Update header count
            const headerText = `${classes.length} Class${classes.length !== 1 ? 'es' : ''} | ${currentLevel === 'a1' ? 'Beginner' : 'Elementary'} level`;
            document.getElementById(`${currentLevel}-header-text`).textContent = headerText;
        }

        // Select class
        function selectClass(classNum) {
            currentClass = classNum;
            updateClassSelector();
            loadContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Load content
        async function loadContent() {
            const contentId = `${currentLevel}-content`;
            const contentDiv = document.getElementById(contentId);

            const classes = manifest[currentLevel] || [];
            const classData = classes.find(c => c.num === currentClass);

            if (!classData) {
                contentDiv.innerHTML = '<p>Class not found</p>';
                return;
            }

            try {
                const response = await fetch(classData.file);
                if (!response.ok) throw new Error('File not found');

                const text = await response.text();
                contentDiv.innerHTML = formatContent(text);
            } catch (error) {
                contentDiv.innerHTML = `<p>Error loading class: ${error.message}</p>`;
            }
        }

        // Format content
        function formatContent(text) {
            return text
                .split('\n')
                .map(line => {
                    line = line.trim();
                    if (!line) return '';

                    // Headings
                    if (line.match(/^#{1,3}\s/)) {
                        const level = line.match(/^#+/)[0].length;
                        const content = line.replace(/^#+\s/, '');
                        return `<h${level}>${content}</h${level}>`;
                    }

                    // Bold & Italic
                    line = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    line = line.replace(/\*(.*?)\*/g, '<em>$1</em>');

                    // Lists
                    if (line.startsWith('- ')) {
                        return `<li>${line.substring(2)}</li>`;
                    }

                    return `<p>${line}</p>`;
                })
                .join('\n')
                .replace(/(<li>.*?<\/li>\n?)+/gs, (match) => `<ul>${match}</ul>`);
        }

        // Scroll to top button
        window.addEventListener('scroll', () => {
            const btn = document.querySelector('.scroll-to-top');
            btn.classList.toggle('show', window.pageYOffset > 300);
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
