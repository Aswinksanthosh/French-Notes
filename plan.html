<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Plan</title>
<style>
:root{--bg:#f7f9fc;--card:#fff;--ink:#1b2a3a;--mut:#667;--green:#2e7d32;--line:#dde3ea;--blue:#1976d2}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a222b;--ink:#e8eef4;--mut:#9aa7b4;--green:#81c784;--line:#2b3744;--blue:#64b5f6}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;text-align:center}
.big{font-size:34px;font-weight:700}.mut{color:var(--mut);font-size:14px}a{color:var(--blue)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--green)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.day{text-align:left}.day h3{margin:0 0 6px;font-size:16px}.day.today{border:2px solid var(--green)}.day.past{opacity:.55}
.blk{padding:6px 0;border-top:1px solid var(--line);font-size:15px}.blk b{display:block;font-size:13px;color:var(--mut);font-weight:600}
.blk label{display:block;padding:3px 0}.blk input{width:18px;height:18px;vertical-align:middle;margin-right:8px}.done{text-decoration:line-through;color:var(--mut)}
.nt{font-size:13px;color:var(--mut);margin-bottom:4px}h2{font-size:16px;margin:20px 0 4px}
.wk{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.dc{flex:0 0 138px;scroll-snap-align:start;margin:0;padding:10px;text-align:left}
.dc .hd{text-align:center;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}.dc .hd b{display:block;font-size:12px;color:var(--mut);text-transform:uppercase}.dc .hd span{font-size:24px;font-weight:700}
.dc.today .hd span{background:var(--green);color:#fff;border-radius:50%;display:inline-block;width:36px;height:36px;line-height:36px}
.dc .nt{font-size:11px;text-align:center}.dc .blk{font-size:13px;padding:5px 0}.dc .blk b{font-size:11px}
.dc label{display:flex;gap:6px;align-items:flex-start;padding:4px 0;line-height:1.25}.dc label input{width:16px;height:16px;margin:1px 0 0;flex:none}
html,body{overflow-x:hidden}.dc .go{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:13px;padding:0 6px;height:22px;flex:none}.dc .lk{display:flex;gap:4px;align-items:center;font-size:12px;padding:3px 0;word-break:break-all}.dc .addl{width:100%;margin-top:6px;font:inherit;font-size:12px;padding:4px;border:1px dashed var(--line);border-radius:6px;background:none;color:var(--mut)}.dc .go{user-select:none;-webkit-user-select:none;touch-action:manipulation}.dc .rw{margin-top:8px;padding:6px;border:1px dashed var(--line);border-radius:8px;font-size:12px;display:flex;gap:4px;align-items:center;justify-content:center;text-align:center}.dc .rw.earned{background:var(--green);color:#fff;border:1px solid var(--green);font-weight:600}.dc .rw.earned .go{color:#fff;border-color:#fff}.dc .addr{background:none;border:0;font:inherit;font-size:14px;color:var(--mut)}.dc a.cn{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}.dc .done a.cn{color:var(--mut)}.dc .chap{display:flex;gap:6px;align-items:flex-start;padding:4px 0;line-height:1.25}.dc .chap.done a.cn{text-decoration:line-through}</style></head><body>
<a href="./">← Back to notes</a>
<div class="card"><div class="mut">Days to exam (Nov 16)</div><div class="big" id="d"></div></div>
<div class="g"><div class="card"><div class="mut">Hours left</div><div class="big" id="h"></div></div>

<div class="card"><div class="mut">Study next</div><div class="big" style="font-size:22px" id="n"></div><div class="mut" id="m"></div></div>
<h2>This week</h2>

<div class="mut" style="margin:-2px 0 8px;font-size:12px">Tap → to move a chapter to the next day. Hold → to move it back.</div>
<div id="week"></div>
<h2 id="tef">TEF practice sources</h2>
<div class="card" style="text-align:left" id="tefList"></div>
<div class="card"><button id="cp" onclick="copyProg()" style="font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">Copy my progress</button><div class="mut" style="margin-top:6px">Paste it to Claude to share what you finished.</div></div>
<script src="plan-data.js"></script>
<script>
const CH=[{"n": 1, "l": "A1", "name": "Alphabet", "min": 25, "ids": 8}, {"n": 2, "l": "A1", "name": "Numbers", "min": 70, "ids": 15}, {"n": 35, "l": "A1", "name": "Groupes de Verbes", "min": 20, "ids": 5}, {"n": 36, "l": "A1", "name": "Verbes Essentiels", "min": 35, "ids": 5}, {"n": 37, "l": "A1", "name": "Groupe (-ER)", "min": 35, "ids": 6}, {"n": 38, "l": "A1", "name": "Groupe (-IR)", "min": 20, "ids": 4}, {"n": 39, "l": "A1", "name": "Groupe (-RE)", "min": 25, "ids": 5}, {"n": 40, "l": "A1", "name": "Verbes Pronominaux", "min": 20, "ids": 4}, {"n": 47, "l": "A1", "name": "Cheat Sheet", "min": 15, "ids": 3}, {"n": 3, "l": "A1", "name": "Greetings", "min": 55, "ids": 9}, {"n": 4, "l": "A1", "name": "Calendar", "min": 30, "ids": 7}, {"n": 5, "l": "A1", "name": "Classroom", "min": 20, "ids": 7}, {"n": 6, "l": "A1", "name": "Endings", "min": 40, "ids": 11}, {"n": 7, "l": "A1", "name": "Articles", "min": 35, "ids": 7}, {"n": 8, "l": "A1", "name": "Gender", "min": 40, "ids": 7}, {"n": 9, "l": "A1", "name": "Hobbies", "min": 60, "ids": 6}, {"n": 10, "l": "A1", "name": "Family", "min": 40, "ids": 7}, {"n": 11, "l": "A1", "name": "Professions", "min": 55, "ids": 7}, {"n": 12, "l": "A1", "name": "Reflexive", "min": 40, "ids": 6}, {"n": 13, "l": "A1", "name": "Future", "min": 50, "ids": 8}, {"n": 14, "l": "A1", "name": "Demonstratives", "min": 40, "ids": 7}, {"n": 15, "l": "A1", "name": "Negation", "min": 20, "ids": 4}, {"n": 16, "l": "A1", "name": "Colors", "min": 45, "ids": 8}, {"n": 17, "l": "A1", "name": "Meals", "min": 45, "ids": 8}, {"n": 18, "l": "A1", "name": "Listening", "min": 50, "ids": 9}, {"n": 19, "l": "A1", "name": "Irregular", "min": 35, "ids": 6}, {"n": 21, "l": "A1", "name": "Description", "min": 55, "ids": 10}, {"n": 22, "l": "A2", "name": "Adjectives", "min": 45, "ids": 11}, {"n": 23, "l": "A2", "name": "Adverbs", "min": 100, "ids": 21}, {"n": 25, "l": "A2", "name": "Prepositions", "min": 80, "ids": 15}, {"n": 26, "l": "A2", "name": "Prepositions + Future", "min": 55, "ids": 11}, {"n": 27, "l": "A2", "name": "Expressions", "min": 55, "ids": 9}, {"n": 28, "l": "A2", "name": "Passé Récent & Le Passé Composé", "min": 50, "ids": 8}, {"n": 29, "l": "A2", "name": "Group 3", "min": 40, "ids": 7}, {"n": 30, "l": "A2", "name": "La Règle", "min": 20, "ids": 4}, {"n": 31, "l": "A2", "name": "Cas Particuliers", "min": 25, "ids": 5}, {"n": 32, "l": "A2", "name": "Exemples & Erreurs", "min": 20, "ids": 4}, {"n": 33, "l": "A2", "name": "Pratique Intensive", "min": 35, "ids": 4}, {"n": 34, "l": "A2", "name": "L'Imparfait", "min": 30, "ids": 8}, {"n": 50, "l": "A2", "name": "Les Souvenirs", "min": 20, "ids": 5}, {"n": 41, "l": "A2", "name": "Narrer au Passé", "min": 35, "ids": 6}, {"n": 42, "l": "A2", "name": "Le COD", "min": 20, "ids": 4}, {"n": 43, "l": "A2", "name": "Pronoms Relatifs", "min": 30, "ids": 6}, {"n": 44, "l": "A2", "name": "Pronoms Y et EN", "min": 30, "ids": 7}, {"n": 45, "l": "A2", "name": "Pronoms Compléments", "min": 35, "ids": 6}, {"n": 46, "l": "A2", "name": "Adjectifs par Catégorie", "min": 90, "ids": 8}, {"n": 48, "l": "A2", "name": "Choisir le Bon \"What\"", "min": 20, "ids": 5}, {"n": 49, "l": "A2", "name": "Négation — Rien, Personne, Plus", "min": 20, "ids": 4}, {"n": 51, "l": "A2", "name": "L'Accord du Participe Passé avec QUE", "min": 25, "ids": 4}, {"n": 52, "l": "A2", "name": "Les Interjections", "min": 20, "ids": 5}, {"n": 53, "l": "A2", "name": "Les Conjonctions de Coordination", "min": 25, "ids": 4}, {"n": 54, "l": "A2", "name": "Le Comparatif", "min": 30, "ids": 6}, {"n": 55, "l": "A2", "name": "Conjonctions de Subordination", "min": 20, "ids": 5}, {"n": 56, "l": "A2", "name": "Description d'Images", "min": 30, "ids": 6}, {"n": 57, "l": "A2", "name": "Le Plus-que-parfait", "min": 30, "ids": 10}, {"n": 58, "l": "A2", "name": "Le Subjonctif", "min": 40, "ids": 10}, {"n": 59, "l": "A2", "name": "Le Gérondif", "min": 20, "ids": 6}, {"n": 20, "l": "A2", "name": "Futur Simple", "min": 30, "ids": 7}, {"n": 60, "l": "A2", "name": "Le Conditionnel", "min": 45, "ids": 13}, {"n": 61, "l": "A2", "name": "Le Pluriel des Noms", "min": 25, "ids": 7}, {"n": 62, "l": "A2", "name": "Les Pronoms — Vue d'Ensemble", "min": 40, "ids": 9}];
function prog(n,t){try{return Math.min(t,Object.values(JSON.parse(localStorage.getItem('checklist_class'+n)||'{}')).filter(Boolean).length)}catch(e){return 0}}
let tot=0,left=0,next=null;
CH.forEach(c=>{const f=c.ids?prog(c.n,c.ids)/c.ids:0;tot+=c.min;left+=c.min*(1-f);if(f<1&&!next)next=c});
const t=new Date();t.setHours(0,0,0,0);
const days=Math.max(0,Math.round((new Date('2026-11-16T00:00:00')-t)/864e5));
const usable=Math.max(1,days-3), pct=Math.round((1-left/tot)*100);
d.textContent=days;h.textContent=(left/60).toFixed(1);p.textContent=(left/60/usable).toFixed(1);
b.style.width=pct+'%';pc.textContent=pct+'% done (last 3 days kept for review)';
n.textContent=next?next.name:'All done 🎉';m.textContent=next?next.l+' · '+next.min+' min':'';

function acts(){try{return JSON.parse(localStorage.getItem('plan_acts')||'{}')}catch(e){return{}}}
function tog(k,on){const a=acts();if(on)a[k]=1;else delete a[k];try{localStorage.setItem('plan_acts',JSON.stringify(a))}catch(e){}}
function lt(d){const x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function lk(){try{return JSON.parse(localStorage.getItem('plan_links')||'{}')}catch(e){return{}}}
function setLk(o){try{localStorage.setItem('plan_links',JSON.stringify(o))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let LP=false,LT=null;
function rw(){try{return JSON.parse(localStorage.getItem('plan_rewards')||'{}')}catch(e){return{}}}
function setRw(o){try{localStorage.setItem('plan_rewards',JSON.stringify(o))}catch(e){}}
function mv(){try{return JSON.parse(localStorage.getItem('plan_moves')||'{}')}catch(e){return{}}}
function setMv(o){try{localStorage.setItem('plan_moves',JSON.stringify(o))}catch(e){}}
function renderWeek(){let earned=0;const A=acts(),M=mv(),T=lt(),byN={};CH.forEach(c=>byN[c.n]=c);
 const done=n=>{const c=byN[n];return !!(c&&c.ids&&prog(c.n,c.ids)/c.ids>=1)};
 const PE=planEff(done,M,T),eff=PE.eff,orig=PE.orig,days=PE.days;
 let h='<div class="wk">';
 W.forEach(d=>{const cls=d.d===T?' today':(d.d<T?' past':'');const parts=d.l.split(' ');
  const lab=(n,own)=>{const c=byN[n];if(!c)return'';const k='c'+c.n,on=done(n);const nxt=days[days.indexOf(d.d)+1],prv=days[days.indexOf(d.d)-1];
   return '<div class="chap'+(on?' done':'')+'"><a class="cn" href="index.html#class'+c.n+'">'+(on?'✓ ':'📚 ')+c.name+'</a>'+(!on&&(nxt||prv)?'<button class="go" data-n="'+n+'" data-to="'+(nxt||'')+'" data-back="'+(prv||'')+'" title="Tap: next day. Hold: previous day">→</button>':'')+'</div>'};
  const carried=Object.keys(eff).filter(n=>eff[n]===d.d&&orig[n]!==d.d);
  h+='<div class="card day dc'+cls+'"><div class="hd"><b>'+parts[0]+'</b><span>'+parts[2]+'</span></div><div class="nt">'+d.n+'</div>';
  if(carried.length)h+='<div class="blk"><b>Moved here</b>'+carried.map(n=>lab(+n)).join('')+'</div>';
  d.b.forEach((b,i)=>{const own=(b.c||[]).filter(n=>eff[n]===d.d);if(!own.length&&!(b.a||[]).length)return;h+='<div class="blk"><b>'+b.t+'</b>'+own.map(n=>lab(n)).join('');
   (b.a||[]).forEach((a,j)=>{const k=d.d+'-'+i+'-'+j;h+='<label><input type="checkbox" data-k="'+k+'"'+(A[k]?' checked':'')+'><span>'+a+(a.indexOf('Combo 2')===0?' <a href="#tef" onclick="event.stopPropagation()">→ sources</a>':'')+'</span></label>'});h+='</div>'});
  const chItems=carried.map(n=>!!done(+n)),acItems=[];d.b.forEach((b,i)=>{(b.c||[]).filter(n=>eff[n]===d.d).forEach(n=>chItems.push(!!done(n)));(b.a||[]).forEach((a,j)=>acItems.push(!!A[d.d+'-'+i+'-'+j]))});
  const RW=rw();
  const rrow=(key,icon,items)=>{if(!items.length)return'';const ok=items.every(Boolean),R=RW[key]||(key.slice(-3)==='-ch'?RW[d.d]:'');if(ok&&R)earned++;
   return '<div class="rw'+(ok&&R?' earned':'')+'">'+(R?'<span>'+(ok?'🎉 ':icon+' ')+esc(R)+'</span><button class="go" data-rd="'+key+'" title="Remove reward">×</button>':'<button class="addr" data-rr="'+key+'">'+icon+' +</button>')+'</div>'};
  h+=rrow(d.d+'-ch','📚',chItems)+rrow(d.d+'-co','🎬',acItems);
  const L=lk()[d.d]||[];h+=L.map((x,i)=>'<div class="lk"><a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.n)+'</a><button class="go" data-ld="'+d.d+'" data-i="'+i+'" title="Remove">×</button></div>').join('')+'<button class="addl" data-d="'+d.d+'">+ link</button>';
  h+='</div>'});
 h+='</div>';document.getElementById('week').innerHTML=h;
 const rc=document.getElementById('rwc');if(rc)rc.textContent='🏆 Rewards earned: '+earned;
 document.querySelectorAll('#week [data-rr]').forEach(b=>b.onclick=()=>{const t=(prompt(b.dataset.rr.slice(-3)==='-ch'?'Reward for finishing the chapters (e.g. a snack, a walk)':'Reward for finishing the combo (e.g. a game, a show)')||'').trim();if(!t)return;const a=rw();a[b.dataset.rr]=t;setRw(a);renderWeek()});
 document.querySelectorAll('#week [data-rd]').forEach(b=>b.onclick=()=>{const a=rw();const k=b.dataset.rd;delete a[k];if(k.slice(-3)==='-ch')delete a[k.slice(0,-3)];setRw(a);renderWeek()});
 document.querySelectorAll('#week .addl').forEach(b=>b.onclick=()=>{let u=(prompt('Paste the link')||'').trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;const n=(prompt('Name (optional)')||'').trim()||u.replace(/^https?:\/\/(www\.)?/,'').slice(0,28);const a=lk();(a[b.dataset.d]=a[b.dataset.d]||[]).push({n:n,u:u});setLk(a);renderWeek()});
 document.querySelectorAll('#week [data-ld]').forEach(b=>b.onclick=()=>{const a=lk();a[b.dataset.ld].splice(+b.dataset.i,1);setLk(a);renderWeek()});
 document.querySelectorAll('#week input').forEach(e=>e.onchange=()=>{tog(e.dataset.k,e.checked);renderWeek()});
 document.querySelectorAll('#week .go[data-n]').forEach(b=>{
  const go=to=>{if(!to)return;const m=mv();m[b.dataset.n]=to;setMv(m);renderWeek()};
  b.onpointerdown=()=>{LP=false;clearTimeout(LT);LT=setTimeout(()=>{LP=true;go(b.dataset.back)},500)};
  const stop=()=>{clearTimeout(LT)};b.onpointerup=stop;b.onpointerleave=stop;b.onpointercancel=stop;
  b.oncontextmenu=e=>e.preventDefault();
  b.onclick=ev=>{ev.preventDefault();if(LP){LP=false;return}go(b.dataset.to)}});
 const t=document.querySelector&&document.querySelector('#week .today');if(t&&t.scrollIntoView)t.scrollIntoView({inline:'start',block:'nearest'})}
renderWeek();

const TEF=[
['Official TEF Canada page (format and info)','https://lefrancaisdesaffaires.fr/en/tests-diplomas/test-for-evaluating-french-tef/tef-canada'],
['2026 official TEF handbook (PDF)','https://www.lefrancaisdesaffaires.fr/wp-content/uploads/2026/04/2026-livret-du-responsable-tef.pdf'],
['GlobalExam: TEF Canada sample exercises','https://global-exam.com/blog/fr/tef-canada-en-quoi-consiste-ce-test/'],
['TEF leaflet, Centre Yves-Thériault (PDF)','https://centre-yves-theriault.cssdm.gouv.qc.ca/files/TEF-depliant-1.pdf.pdf'],
['TV5Monde Apprendre le français (listening + reading by level)','https://apprendre.tv5monde.com/'],
['RFI Journal en français facile (listening)','https://francaisfacile.rfi.fr/']];
(function(){const A=acts();document.getElementById('tefList').innerHTML=TEF.map((s,i)=>{const k='tef'+i,on=A[k];return '<label class="'+(on?'done':'')+'" style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-k="'+k+'"'+(on?' checked':'')+' style="width:18px;height:18px;flex:none"><a href="'+s[1]+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+s[0]+'</a></label>'}).join('');
document.querySelectorAll('#tefList input').forEach(e=>e.onchange=()=>{tog(e.dataset.k,e.checked);e.parentNode.classList.toggle('done',e.checked)})})();
function copyProg(){const A=acts(),L=[];W.forEach(d=>{const s=[];d.b.forEach((b,i)=>{(b.c||[]).forEach(n=>{const c=CH.find(c=>c.n===n);if(c&&c.ids&&prog(c.n,c.ids)/c.ids>=1)s.push(c.name)});(b.a||[]).forEach((a,j)=>{if(A[d.d+'-'+i+'-'+j])s.push(a)})});if(s.length)L.push(d.l+': '+s.join(', '))});
 const t=L.join('\n')||'Nothing ticked yet';try{navigator.clipboard.writeText(t);document.getElementById('cp').textContent='Copied ✓'}catch(e){prompt('Copy this:',t)}}
</script></body></html>
